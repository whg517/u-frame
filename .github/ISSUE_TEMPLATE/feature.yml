name: 功能建议
description: 提议一个符合本地机柜与物理资产管理边界的能力
title: "[Feature] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 用户场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述希望达成的业务结果，不必先限定实现方案。
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 当前操作路径
      description: 现有功能如何完成或为什么无法完成？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议与本地桌面、单用户、离线优先的产品定位一致。
          required: true
