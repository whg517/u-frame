name: 缺陷报告
description: 报告可以稳定复现的 UFrame 功能或界面问题
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴密码、证书、完整资产台账或包含敏感信息的数据库。安全问题请先按 SECURITY.md 通过私密渠道联系维护者。
  - type: input
    id: version
    attributes:
      label: UFrame 版本
      description: 例如 v0.1.0 或提交 SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与硬件
      description: 例如 macOS 15.6，Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从应用启动开始，列出最短可复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或脱敏日志
      description: 上传前请移除设备标识、IP、SN、用户目录和其他敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 本报告不包含密码、证书或未脱敏的资产数据。
          required: true
