name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: verify-release-source
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Validate release tag and main ancestry
        run: bash scripts/check-release-source.sh
      - name: Install Rust toolchain
        run: node scripts/install-rust-toolchain.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete quality gate
        run: pnpm gate

  macos-universal:
    name: signed-universal-macos
    needs: verify-source
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Revalidate release source on the signing runner
        run: bash scripts/check-release-source.sh
      - name: Install Rust toolchain and macOS targets
        run: node scripts/install-rust-toolchain.mjs --universal
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build signed and notarized universal application
        id: signed_build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-signed-release.sh
      - name: Verify application and prepare checksum
        run: >-
          pnpm release:verify
          "${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle"
          "${RUNNER_TEMP}/SHA256SUMS"
      - name: Create draft GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/publish-release.sh
          "${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle"
          "${RUNNER_TEMP}/SHA256SUMS"
