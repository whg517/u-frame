name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-universal:
    name: signed-universal-macos
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require signing and notarization credentials
        shell: bash
        run: |
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'ERROR: missing release environment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Rust toolchain and macOS targets
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain 1.98.1

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and source
        shell: bash
        run: |
          pnpm version:check -- "${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "${GITHUB_REF_NAME}")" != "tag" ]]; then
            printf 'ERROR: release tags must be annotated tags\n' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            printf 'ERROR: release tag must point to a commit contained in origin/main\n' >&2
            exit 1
          fi

      - name: Run complete quality gate
        run: pnpm gate

      - name: Build signed and notarized universal application
        run: pnpm release:build

      - name: Verify application and prepare checksum
        run: >-
          pnpm release:verify --
          "${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle"
          "${RUNNER_TEMP}/SHA256SUMS"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          release_args=(
            "${GITHUB_REF_NAME}"
            "${dmg_path}#UFrame universal macOS DMG"
            "${RUNNER_TEMP}/SHA256SUMS#SHA-256 checksums"
            --draft
            --generate-notes
            --title "UFrame ${GITHUB_REF_NAME}"
            --verify-tag
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
